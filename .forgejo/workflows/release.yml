# Rolling release for linear-cli-rs.
#
# A push to main builds the release binary on the instance's own runner and
# republishes it as the `rolling` release here, moving the tag to the commit
# that just built. The tag is a pointer, not a version: every green push
# replaces it, and the release body records which commit and which toolchain
# produced the artefact that is currently attached.
#
# runs-on: glibc is a LABEL and the label names an image: the instance's runner
# maps it to a throwaway ubuntu:26.04 container, and that runner sets
# `container.network: host`, which is why the loopback URLs below resolve. A
# per-job `container:` block does NOT work on this runner - it ignores it and
# the job dies at container setup - so the image comes from the label and the
# workflow only asks for the label.
#
# Everything talks to the instance over loopback (127.0.0.1:3000), never
# https://git.vedaru.cn. The public name resolves through Cloudflare, which
# completes TCP on its IPv6 addresses and then drops the TLS ClientHello, and
# which has answered 502/524 on large uploads. Same host: the loopback hop is
# shorter and never leaves the machine.
#
# There is deliberately no actions/checkout. The default action source is
# github.com - the one host this setup exists to avoid - so the checkout is a
# plain `git clone` over loopback, authenticating with the repo's
# FORGEJO_TOKEN secret through an inline credential helper rather than writing
# a credential file into the job container.
#
# Nothing from the host is mounted. The job container is a bare ubuntu:26.04,
# so the toolchain is installed inside it by the first step. The Rust version is
# pinned rather than tracking `stable`: 1.93.1 is the toolchain that produced
# the green `cargo build` / `cargo test` / `cargo clippy -D warnings` run this
# port was accepted on, so a toolchain bump stays a deliberate act with a green
# run behind it. (The repo's `rust-version = "1.80"` is not a usable floor: the
# locked dependency `time-core 0.1.9` declares the `edition2024` Cargo feature,
# which needs Cargo >= 1.85 to even parse.)
#
# `cargo fmt --check` is deliberately NOT part of the gate. It is not part of
# this repo's gate (build + test + clippy), and parts of the tree predate the
# formatting the current rustfmt produces, so it would fail on files this
# workflow never touches. `cargo clippy --all-targets -- -D warnings` is the
# strong signal here and it is enforced.
#
# Only these workflow expressions are used, all of them verified present on this
# instance: `forge.repository`, `forge.sha`, `secrets.FORGEJO_TOKEN` and
# `runner.temp`.
name: Rolling release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: glibc
    steps:
      - name: Install the build toolchain
        # The job container is a bare ubuntu:26.04: nothing may be assumed from
        # the host, including the linker the -sys crates need.
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y --no-install-recommends \
              build-essential ca-certificates curl git pkg-config python3
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal \
              --default-toolchain 1.93.1 --no-modify-path \
              -c clippy
          "$HOME/.cargo/bin/cargo" --version
          "$HOME/.cargo/bin/rustc" --version

      - name: Check out this repository
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/linear-cli-rs"
          rm -rf "$src"
          helper='!f() { echo "username=x"; printf "password=%s\n" "$FORGEJO_TOKEN"; }; f'
          git -c credential.helper= -c "credential.helper=$helper" \
              clone --quiet --depth 1 \
              http://127.0.0.1:3000/${{ forge.repository }}.git "$src"
          echo "checked out $(git -C "$src" rev-parse HEAD)"

      - name: Gate - build, test, clippy
        # Every check runs and the step fails once at the end with a summary, so
        # a red run names everything that is wrong rather than only the first
        # thing: one push then fixes all of it instead of one problem per run.
        # --locked keeps Cargo.lock as the source of truth, so a published
        # binary is reproducible from it. Nothing is published unless this
        # step's exit status is zero.
        run: |
          set -uo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cd "$RUNNER_TEMP/linear-cli-rs"
          rc=0
          check() {
            local name="$1"; shift
            echo "=== $name ==="
            if "$@"; then
              echo "PASS: $name"
            else
              local status=$?
              echo "FAIL: $name (exit $status)"
              rc=1
            fi
          }
          # `--all-features` is not decoration: the default feature set is the CLI alone, and the
          # service half's suites are gated on `service`. Without it, `cargo test --workspace`
          # would compile those files to nothing and pass - green by absence, the same trap the
          # `default-members` note in Cargo.toml describes one level up. The `--no-default-features`
          # clippy checks the other shape, which is what a laptop installs from source.
          check "cargo build --workspace --locked" cargo build --workspace --locked
          check "cargo test --workspace --all-features --locked" cargo test --workspace --all-features --locked -- --test-threads=4
          check "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings" \
                cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          check "cargo clippy -p linear --no-default-features --all-targets --locked -- -D warnings" \
                cargo clippy -p linear --no-default-features --all-targets --locked -- -D warnings
          check "cargo build --release --workspace --all-features --locked" cargo build --release --workspace --all-features --locked
          check "cargo build --release -p linear --no-default-features --locked" \
                cargo build --release -p linear --no-default-features --locked
          if [ "$rc" -eq 0 ]; then echo "gate: PASS"; else echo "gate: FAIL"; fi
          exit "$rc"

      - name: Package the release binaries
        # Two archives, because the two jobs are the same tool at two sizes: the **service** build
        # (the mirroring engine and the intake server - what a deployment installs) and the **CLI**
        # build (what a laptop installs). They differ only by the `service` feature, so the second
        # build reuses every compiled dependency and compiles one crate.
        #
        # Order matters: both builds write `target/release/linear`, so the service binary is copied
        # aside *before* the CLI build overwrites that path. Packaging the wrong one of these is
        # silent - the archive would simply be missing `webhook` - so each is named for what it is.
        env:
          SHA: ${{ forge.sha }}
        run: |
          set -euo pipefail
          # The toolchain is installed with `--no-modify-path`, so cargo is not on the runner's
          # PATH - the gate step exports this too, and the first run of this step failed here with
          # `cargo: command not found` *after* a green gate.
          export PATH="$HOME/.cargo/bin:$PATH"
          src="$RUNNER_TEMP/linear-cli-rs"
          out="$RUNNER_TEMP/dist"
          bins="$RUNNER_TEMP/bins"
          rm -rf "$out" "$bins" "$RUNNER_TEMP/stage"
          mkdir -p "$out" "$bins" "$RUNNER_TEMP/stage"
          short=$(printf '%s' "$SHA" | cut -c1-12)
          stem="linear-cli-rs-${short}"

          # Build the service shape here rather than trusting what the gate left at
          # `target/release/linear`: both shapes write that one path, and the gate's last release
          # build is the CLI-only one, so the first version of this step copied the same binary
          # twice (caught by the size assertion below, after a fully green gate). Usually a no-op,
          # since the gate has just built this shape.
          cargo build --release --workspace --all-features --locked
          install -m 0755 "$src/target/release/linear" "$bins/linear-service"
          cargo build --release -p linear --no-default-features --locked
          install -m 0755 "$src/target/release/linear" "$bins/linear-cli"

          # The two must actually differ, or the feature gate is decorative and the "CLI" archive
          # is the service under another name. Both directions, because either copy can be wrong.
          service_size=$(stat -c%s "$bins/linear-service")
          cli_size=$(stat -c%s "$bins/linear-cli")
          echo "service binary: $service_size bytes; cli binary: $cli_size bytes"
          if [ "$service_size" -le "$cli_size" ]; then
            echo "the service build is not larger than the CLI build - the feature gate is not doing anything" >&2
            exit 1
          fi
          "$bins/linear-service" webhook --help >/dev/null 2>&1 || {
            echo "the service build does not answer \`webhook\` - it was built without the service feature" >&2
            exit 1
          }
          "$bins/linear-cli" webhook --help >/dev/null 2>&1 && {
            echo "the CLI build answers \`webhook\` - it was built with the service feature" >&2
            exit 1
          } || true

          stage_archive() { # <name> <binary>
            name="$1"; bin="$2"
            stage="$RUNNER_TEMP/stage/$name"
            rm -rf "$stage"
            mkdir -p "$stage"
            # The archive holds the binary at the top level plus the documents a release reader
            # needs; AGENTS.md is here for the same reason the repository ships it - this port is
            # written to be driven by agents.
            install -m 0755 "$bin" "$stage/linear"
            cp "$src/README.md" "$stage/README.md"
            cp "$src/AGENTS.md" "$stage/AGENTS.md"
            tar czf "$out/$name.tar.gz" -C "$RUNNER_TEMP/stage" "$name"
            (cd "$out" && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          }

          stage_archive "${stem}-service-x86_64-unknown-linux-gnu" "$bins/linear-service"
          stage_archive "${stem}-x86_64-unknown-linux-gnu" "$bins/linear-cli"
          ls -l "$out"

      - name: Publish the rolling release
        # The previous release and tag are removed first: `rolling` must name the
        # commit that just built, not the first commit that ever did. The release
        # is marked prerelease because the tag moves underneath it.
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_URL: http://127.0.0.1:3000
          SHA: ${{ forge.sha }}
        run: |
          set -euo pipefail
          api="$FORGEJO_URL/api/v1/repos/${{ forge.repository }}"
          auth=(-H "Authorization: token $FORGEJO_TOKEN")
          out="$RUNNER_TEMP/dist"
          short=$(printf '%s' "$SHA" | cut -c1-12)
          # Both archives and both digests. Globbing into an array rather than `ls "$out"/*.tar.gz`
          # (which would take one of them) or a for-loop over unquoted output (which breaks on
          # names with spaces): every file that was packaged has to reach the release, and the
          # loop at the end checks nothing was left behind.
          files=("$out"/*.tar.gz "$out"/*.tar.gz.sha256)

          # Parse the release id out of the API's JSON with a real parser. A
          # greedy `sed 's/.*"id":\([0-9]*\).*/\1/'` looks like it works and
          # does not: the release object carries `{"id":<release>,...,"author":
          # {"id":<user>}}`, so the greedy match captures the AUTHOR's id, the
          # asset POST then targets a release that does not exist, and the run
          # goes red after publishing a release with no assets.
          id_of() { python3 -c 'import json,sys;print(json.load(sys.stdin).get("id",""))'; }

          # Drop whatever `rolling` pointed at before: release first, then tag.
          rel=$(curl -sS "${auth[@]}" "$api/releases/tags/rolling" || true)
          rid_old=$(printf '%s' "$rel" | id_of)
          if [ -n "${rid_old:-}" ]; then
            echo "deleting previous rolling release id=$rid_old"
            curl -sS -X DELETE "${auth[@]}" "$api/releases/$rid_old" >/dev/null
          fi
          curl -sS -X DELETE "${auth[@]}" "$api/tags/rolling" >/dev/null || true

          # The body names each asset with its digest, so a reader can tell the two builds apart
          # without downloading both: `-service-` is the deployment's, the other is the CLI alone.
          {
            printf '%s\n' "Rolling build of \`$short\` - the last commit on main that built, gated and published."
            printf '\n'
            printf -- '- commit: \`%s\`\n' "$SHA"
            printf -- '- toolchain: %s\n\n' "$("$HOME/.cargo/bin/rustc" --version)"
            printf '%s\n' '| asset | sha256 |' '| -- | -- |'
            for f in "$out"/*.tar.gz; do
              printf '| \`%s\` | \`%s\` |\n' "$(basename "$f")" "$(cut -d' ' -f1 "$f.sha256")"
            done
            printf '\n'
            printf '%s\n' '`*-service-*` carries the bridge half - `linear sync` and `linear webhook` - and is what a deployment installs.'
            printf '%s\n' 'The other archive is the CLI alone: no store, no intake server, no SQLite.'
            printf '\n'
            printf '%s\n' 'Assets are rebuilt and replaced on every push to main.'
          } > "$RUNNER_TEMP/body.md"
          body=$(cat "$RUNNER_TEMP/body.md")
          payload=$(BODY="$body" SHA="$SHA" python3 -c \
              'import json,os;print(json.dumps({"tag_name":"rolling","target_commitish":os.environ["SHA"],"name":"Rolling build","body":os.environ["BODY"],"draft":False,"prerelease":True}))')
          created=$(curl -sS -X POST "${auth[@]}" -H "Content-Type: application/json" \
              --data-binary "$payload" "$api/releases")
          rid=$(printf '%s' "$created" | id_of)
          [ -n "${rid:-}" ] || { echo "release creation failed: $created" >&2; exit 1; }
          echo "created rolling release id=$rid"

          for f in "${files[@]}"; do
            name=$(basename "$f")
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "${auth[@]}" \
                -F "attachment=@$f" "$api/releases/$rid/assets?name=$name")
            echo "uploaded $name -> HTTP $code"
            [ "$code" = 201 ] || { echo "asset upload for $name failed" >&2; exit 1; }
          done

          # Read the release back and require the assets to be attached: a 201
          # that attached nothing would otherwise look exactly like success.
          final=$(curl -sS "${auth[@]}" "$api/releases/$rid")
          attached=$(printf '%s' "$final" | python3 -c \
              'import json,sys;print(" ".join(a.get("name","") for a in (json.load(sys.stdin).get("assets") or [])))')
          echo "assets attached: $attached"
          for f in "${files[@]}"; do
            base=$(basename "$f")
            case " $attached " in
              *" $base "*) ;;
              *) echo "asset $base is NOT attached to release $rid" >&2; exit 1;;
            esac
          done

          echo "rolling release now points at $SHA"
