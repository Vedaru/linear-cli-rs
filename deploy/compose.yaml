# The bridge as a container, on the host's network.
#
#   docker compose -f deploy/compose.yaml up -d
#
# `network_mode: host` is the point of this file. Two things depend on it:
#
#   * Forgejo can post to the bridge at `http://127.0.0.1:8787/webhooks/forgejo`, because the
#     container and the forge share a loopback - no published port, no gateway, nothing in
#     between to answer 302;
#   * the bridge reaches Forgejo at `http://127.0.0.1:3000` for the same reason, so the config
#     needs no hostname that might change.
#
# Mount a config and a secrets file that exist on the host; neither is in the image.

services:
  linear-bridge:
    build:
      # `--network host` during the build, because the release asset is fetched from the
      # server's own Forgejo on loopback. See deploy/Dockerfile.
      context: ..
      dockerfile: deploy/Dockerfile
      network: host
      args:
        RELEASE_URL: ${RELEASE_URL:?set RELEASE_URL to the release asset}
        RELEASE_SHA256: ${RELEASE_SHA256:?set RELEASE_SHA256 to its digest}
    image: linear-bridge
    container_name: linear-bridge
    restart: unless-stopped
    network_mode: host
    env_file:
      # LINEAR_API_KEY, FORGEJO_TOKEN, FORGEJO_WEBHOOK_SECRET, LINEAR_WEBHOOK_SECRET.
      - ${SECRETS_FILE:-/etc/linear-bridge/secrets.env}
    volumes:
      - ${CONFIG_FILE:-/etc/linear-bridge/linear.toml}:/etc/linear-bridge/linear.toml:ro
      - linear-bridge-store:/var/lib/linear-bridge
    # No ports: with host networking the service binds the host's own 127.0.0.1:8787.

  # The Linear direction, pulled rather than pushed: the same sweep the systemd timer runs, on the
  # same volume, so it needs no route from outside and no secret of its own. `--apply` because a
  # timer run is the one sweep that should write.
  linear-bridge-sync:
    image: linear-bridge
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${SECRETS_FILE:-/etc/linear-bridge/secrets.env}
    volumes:
      - ${CONFIG_FILE:-/etc/linear-bridge/linear.toml}:/etc/linear-bridge/linear.toml:ro
      - linear-bridge-store:/var/lib/linear-bridge
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /usr/local/bin/linear sync --apply --config /etc/linear-bridge/linear.toml || true
          sleep 300
        done
    depends_on:
      - linear-bridge

volumes:
  linear-bridge-store:
