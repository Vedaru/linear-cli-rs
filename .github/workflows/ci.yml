name: CI

# One workflow for the GitHub mirror: test, then build, then publish.
#
#   test    - the three-OS matrix (clippy on Linux, tests everywhere);
#             runs on pull requests too, so nothing publishes from a PR.
#   build   - two release archives per target - the service build (the bridge
#             half) and the CLI alone - for five targets, each staged with
#             README, AGENTS.md and LICENSE and a .sha256 beside the archive.
#   publish - one release tagged `rolling`, whose assets are replaced on every
#             push to main, so a download URL always serves the newest green
#             build. Mirrors what .forgejo/workflows/release.yml does for the
#             primary remote (Forgejo ignores .github, so the two cannot share a
#             file).
#
# GitHub runners are free for public repositories, which is why the build matrix
# is wider than Forgejo's: it adds a static musl Linux build and both macOS
# architectures.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `cargo fmt --check` is deliberately not in this gate. The repo's gate is build + test +
      # clippy - the same gate `.forgejo/workflows/release.yml` runs - because rustfmt's output
      # drifts with the toolchain, so a check here can fail on formatting the maintained tree never
      # produced. Format locally; it is not a merge gate.
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        # `--all-features` so the service half is linted too; `--no-default-features` so the shape
        # a laptop installs is. The default feature set is the CLI alone.
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo clippy -p linear --no-default-features --all-targets --locked -- -D warnings
      # Bounded: four cores, and an unbounded run oversubscribes itself, which
      # makes wall-clock waits inside tests fail for unrelated reasons.
      # `--all-features`: the gated suites compile to nothing without it.
      - name: Test
        # `--no-fail-fast`: one red binary hides every suite behind it, and this matrix
        # leg is the only place some of them ever run.
        run: cargo test --workspace --all-features --locked --no-fail-fast -- --test-threads=4

  build:
    name: Build (${{ matrix.target }})
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build both shapes
        # Two builds, because the two archives are the same tool at two sizes: the **service**
        # build (the mirroring engine and the intake server - what a deployment installs) and the
        # **CLI** build (what a laptop installs). They differ only by the `service` feature. Both
        # write `target/<triple>/release/linear`, so the service binary is copied aside *before*
        # the CLI build overwrites it; packaging the wrong one is silent (the archive would just
        # be missing `webhook`), so the sizes are compared and `webhook` is probed on both.
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          mkdir -p bins
          cargo build --release --workspace --all-features --locked --target "$target"
          cp "target/$target/release/linear$exe" "bins/linear-service$exe"
          cargo build --release -p linear --no-default-features --locked --target "$target"
          cp "target/$target/release/linear$exe" "bins/linear-cli$exe"
          service_size=$(wc -c < "bins/linear-service$exe")
          cli_size=$(wc -c < "bins/linear-cli$exe")
          echo "service binary: $service_size bytes; cli binary: $cli_size bytes"
          if [ "$service_size" -le "$cli_size" ]; then
            echo "the service build is not larger than the CLI build - the feature gate is not doing anything" >&2
            exit 1
          fi
          "./bins/linear-service$exe" webhook --help >/dev/null 2>&1 || {
            echo "the service build does not answer \`webhook\` - it was built without the service feature" >&2
            exit 1
          }
          if "./bins/linear-cli$exe" webhook --help >/dev/null 2>&1; then
            echo "the CLI build answers \`webhook\` - it was built with the service feature" >&2
            exit 1
          fi
      - name: Stage (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          stage() { # <archive-name> <binary>
            name="$1"; bin="$2"
            rm -rf "dist/$name"; mkdir -p "dist/$name"
            install -m 0755 "$bin" "dist/$name/linear"
            cp README.md AGENTS.md LICENSE "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -rf "dist/$name"
            ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )
          }
          mkdir -p dist
          stage "linear-cli-rs-${sha}-service-${{ matrix.target }}" bins/linear-service
          stage "linear-cli-rs-${sha}-${{ matrix.target }}" bins/linear-cli
          ls -l dist
      - name: Stage (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Substring(0,12)
          function Stage($Name, $Bin) {
            New-Item -ItemType Directory -Force -Path "dist/$Name" | Out-Null
            Copy-Item $Bin "dist/$Name/linear.exe"
            Copy-Item README.md,AGENTS.md,LICENSE "dist/$Name/"
            Compress-Archive -Path "dist/$Name" -DestinationPath "dist/$Name.zip"
            Remove-Item -Recurse -Force "dist/$Name"
            $h = (Get-FileHash "dist/$Name.zip" -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "dist/$Name.zip.sha256" -Value "$h  $Name.zip"
          }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Stage "linear-cli-rs-$sha-service-${{ matrix.target }}" "bins/linear-service.exe"
          Stage "linear-cli-rs-$sha-${{ matrix.target }}" "bins/linear-cli.exe"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish rolling release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          notes="Rolling build of \`${sha}\` - the newest commit on main that passed the tests.

          Two archives per target, as the Forgejo release does: \`*-service-*\` carries the bridge
          half (\`linear sync\` and \`linear webhook\`) and is what a deployment installs; the other
          is the CLI alone. A \`.sha256\` sits next to each archive."
          # Idempotent: create the release if it is missing, then always move the
          # tag to this commit and replace the assets. Both are best-effort steps
          # whose failure is not fatal - the upload below is what must succeed.
          gh release create rolling --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Rolling build" --prerelease \
            --notes "$notes" 2>/dev/null || true
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/rolling" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1 || true
          # Only regular files are assets: the staging directories are not
          # uploadable, and passing them made the upload step fail.
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          printf '  uploading: %s\n' "${assets[@]}"
          # Assets are named after the commit, so --clobber cannot replace an
          # older commit's set: drop anything not in this build first, otherwise
          # every push leaves another ten assets behind.
          mapfile -t keep < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          while read -r stale; do
            [ -z "$stale" ] && continue
            if ! printf '%s\n' "${keep[@]}" | grep -qx -- "$stale"; then
              echo "  pruning stale asset: $stale"
              gh release delete-asset rolling "$stale" --repo "$GITHUB_REPOSITORY" --yes || true
            fi
          done < <(gh release view rolling --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          gh release upload rolling "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          echo "--- published:"
          gh release view rolling --repo "$GITHUB_REPOSITORY" --json tagName,url,assets \
            --jq '.tagName, .url, (.assets[] | "  \(.name)  \(.size) bytes")'
