name: Release

# GitHub half of the two-forge release story. The Forgejo pipeline publishes the
# rolling release for the primary remote; this workflow does the same for the
# GitHub mirror, so both `git.vedaru.cn` and `github.com` download URLs serve the
# newest green build of main. Same contract as the Forgejo workflow:
#   * gate first - tests, clippy and rustfmt must pass before anything publishes;
#   * one release, tagged `rolling`, whose assets are replaced on every push;
#   * assets are a tarball (zip on Windows) holding the binary, README, AGENTS.md
#     and LICENSE, plus a .sha256 next to it.
# Extra targets exist here because GitHub runners are free for public repos:
# a static musl build and both macOS architectures, which Forgejo does not build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  build:
    name: Build (${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          name="linear-cli-rs-${sha}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          install -m 0755 "target/${{ matrix.target }}/release/linear" "dist/$name/linear"
          cp README.md AGENTS.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )
          ls -l dist
      - name: Stage (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Substring(0,12)
          $name = "linear-cli-rs-$sha-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/linear.exe" "dist/$name/linear.exe"
          Copy-Item README.md,AGENTS.md,LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $h = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/$name.zip.sha256" -Value "$h  $name.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish rolling release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          notes="Rolling build of \`${sha}\` - the newest commit on main that passed the gate.

          Assets are rebuilt and replaced on every push to main. A \`.sha256\` sits next to
          each archive; the binary is also inside its own directory alongside README.md,
          AGENTS.md and LICENSE."
          if gh release view rolling --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Move the tag to this commit, then replace every asset.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/rolling" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload rolling dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create rolling dist/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Rolling build" --prerelease \
              --notes "$notes"
          fi
          echo "--- published:"
          gh release view rolling --repo "$GITHUB_REPOSITORY" --json tagName,url,assets \
            --jq '.tagName, .url, (.assets[] | "  \(.name)  \(.size) bytes")'
