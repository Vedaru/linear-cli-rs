[package]
name = "linear-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
hmac = "0.12"
log = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tiny_http = "0.12"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
# The conformance fixtures are TOML, like the presets they describe, so the harness parses
# them the same way a deployment's config is parsed.
toml = "0.9"
