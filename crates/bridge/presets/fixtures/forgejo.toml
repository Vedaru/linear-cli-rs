path = "/api/v1/repos/Vedaru/linear-cli-rs/issues"
status = 201
answer = '''{ "number": 12, "html_url": "http://forge/Vedaru/linear-cli-rs/issues/12" }'''

[[api]]
method = "PATCH"
path = "/api/v1/repos/Vedaru/linear-cli-rs/issues/12"
answer = '''{ "number": 12 }'''

[[api]]
method = "PUT"
path = "/api/v1/repos/Vedaru/linear-cli-rs/issues/12/labels"
