[[api]]
method = "PATCH"
path = "/api/v1/repos/Vedaru/linear-cli-rs/issues/comments/77"
answer = '''{ "id": 77 }'''

[[api]]
method = "DELETE"
path = "/api/v1/repos/Vedaru/linear-cli-rs/issues/comments/77"
answer = '''{}'''

