# A delivery this platform really sends, for the conformance suite.

body = '''{
  "action": "opened",
  "repository": { "full_name": "o/r" },
  "sender": { "login": "vedaru" },
  "issue": { "number": 12, "html_url": "https://github.com/o/r/issues/12" }
}'''

[headers]
"X-GitHub-Event" = "issues"

# The proof this platform actually sends, so the suite checks the preset against the
# real contract rather than against itself.
[proof]
algorithm = "hmac-sha256"
header = "X-Hub-Signature-256"
prefix = "sha256="

# --- what its API answers ---------------------------------------------------
#
# The write half of this platform, as configuration. The list path is a prefix because
# the query a request carries is the sink's business, not the fixture's.

[[api]]
method = "POST"
path = "/repos/o/r/issues"
status = 201
answer = '''{ "number": 12, "html_url": "https://github.com/o/r/issues/12" }'''

[[api]]
method = "PATCH"
path = "/repos/o/r/issues/12"
answer = '''{ "number": 12 }'''

[[api]]
method = "PUT"
path = "/repos/o/r/issues/12/labels"
answer = '''[]'''

[[api]]
method = "POST"
path = "/repos/o/r/issues/12/comments"
status = 201
answer = '''{ "id": 77, "html_url": "https://github.com/o/r/issues/12#issuecomment-77" }'''

[[api]]
method = "GET"
path = "/repos/o/r/issues/12"
answer = '''{
  "number": 12,
  "html_url": "https://github.com/o/r/issues/12",
  "title": "Mirror the thing",
  "body": "why it matters",
  "state": "closed",
  "labels": [{ "name": "bug" }, { "name": "priority:high" }, { "name": "due:2026-10-09" }],
  "assignees": [{ "login": "vedaru" }]
}'''

[[api]]
method = "GET"
path = "/repos/o/r/issues?*"
answer = '''[
  { "number": 12, "html_url": "https://github.com/o/r/issues/12",
    "title": "Mirror the thing", "body": "why it matters", "state": "open",
    "labels": [{ "name": "bug" }], "assignees": [{ "login": "vedaru" }] }
]'''
