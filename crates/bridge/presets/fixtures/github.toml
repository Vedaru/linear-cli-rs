# A delivery this platform really sends, for the conformance suite.

body = '''{
  "action": "opened",
  "repository": { "full_name": "o/r" },
  "sender": { "login": "vedaru" },
  "issue": { "number": 12, "html_url": "https://github.com/o/r/issues/12" }
}'''

[headers]
"X-GitHub-Event" = "issues"

# The proof this platform actually sends, so the suite checks the preset against the
# real contract rather than against itself.
[proof]
algorithm = "hmac-sha256"
header = "X-Hub-Signature-256"
prefix = "sha256="
