# A delivery this platform really sends, for the conformance suite.
#
# Nothing here is code, and nothing about it is specific to the suite's Rust: the harness
# reads this file, signs the body with the scheme the *preset* declares, and runs the
# shared checks. Adding a platform is therefore a preset and a file like this one.
#
# `body` comes first on purpose: in TOML, keys after a table header belong to that table.

# `{now}` is the current time in milliseconds. A fixture that uses it is one whose payload
# carries its own time, and the harness then also requires a stale copy to be refused -
# a scheme that binds time cannot pretend it does not.
body = '''{
  "action": "create",
  "type": "Issue",
  "webhookTimestamp": {now},
  "data": { "id": "issue-uuid", "identifier": "VED-1", "team": { "key": "VED" } }
}'''

# Headers the platform sends that are not the proof - the harness adds that itself, from
# the preset's own signature scheme, which is why nothing platform-specific lives in Rust.
[headers]
"Linear-Event" = "Issue"
"Linear-Delivery" = "d-1"

# The proof this platform actually sends, so the suite checks the preset against the
# real contract rather than against itself.
[proof]
algorithm = "hmac-sha256"
header = "Linear-Signature"

# --- the deliveries ---------------------------------------------------------
#
# What this platform sends, and what the bridge must make of each one. The bodies are the
# real shapes; the expectations are what a reader of Linear's documentation would say they
# mean. Nothing here is Rust, and nothing in the suite knows Linear.

[[delivery]]
event = "Issue"
kind = "issue"
action = "created"
id = "issue-uuid"
scope = "VED"
delivery_id = "d-1"
url = "https://linear.app/vedaru/issue/VED-1/x"
actor = "user-1"
body = '''{
  "action": "create", "type": "Issue",
  "url": "https://linear.app/vedaru/issue/VED-1/x",
  "webhookTimestamp": {now},
  "actor": { "id": "user-1", "name": "loner" },
  "data": { "id": "issue-uuid", "identifier": "VED-1", "team": { "key": "VED" } }
}'''

[[delivery]]
# The same event, updated: Linear spells the action inside the body.
event = "Issue"
kind = "issue"
action = "updated"
id = "i"
scope = "VED"
body = '''{ "action": "update", "type": "Issue", "webhookTimestamp": {now},
  "data": { "id": "i", "team": { "key": "VED" } } }'''

[[delivery]]
event = "Issue"
kind = "issue"
action = "deleted"
id = "i"
scope = "VED"
body = '''{ "action": "remove", "type": "Issue", "webhookTimestamp": {now},
  "data": { "id": "i", "team": { "key": "VED" } } }'''

[[delivery]]
# A comment: the subject is the *issue* it is on - what a link pairs - and the comment's
# own id and text ride in the detail.
event = "Comment"
kind = "comment"
action = "created"
id = "issue-uuid"
comment_id = "comment-1"
comment_body = "hello"
body = '''{ "action": "create", "type": "Comment", "webhookTimestamp": {now},
  "data": { "id": "comment-1", "body": "hello", "issue": { "id": "issue-uuid" } } }'''

[[delivery]]
# A project: an entity of its own, not an issue. The mapping's `sync_projects`
# decides whether it travels; the preset only has to read it as a project.
event = "Project"
kind = "project"
action = "created"
id = "project-uuid"
body = '''{ "action": "create", "type": "Project", "webhookTimestamp": {now},
  "data": { "id": "project-uuid", "name": "Mirror the projects" } }'''

[[delivery]]
# A type this preset does not model. It survives as an event rather than being dropped:
# acknowledging a delivery from a newer Linear version beats failing it.
event = "ProjectUpdate"
kind = "other"
other_name = "ProjectUpdate"
body = '''{ "action": "create", "type": "ProjectUpdate", "webhookTimestamp": {now},
  "data": { "id": "p-1" } }'''

[[delivery]]
# No time at all: the scheme binds it, so this cannot be trusted and is refused.
reject = "stale"
body = '''{ "action": "create", "type": "Issue", "data": { "id": "i" } }'''

[[delivery]]
# An issue with no id: the preset has nothing to pair, and says so by name.
reject = "malformed"
body = '''{ "action": "create", "type": "Issue", "webhookTimestamp": {now},
  "data": { "team": { "key": "VED" } } }'''

[[delivery]]
reject = "malformed"
body = '''not json'''

# Linear answers everything on one url, so these are told apart by what the body asks for.
# The shapes are the ones the preset's read spec and attach operation expect.

[[api]]
method = "POST"
path = "/graphql"
match = "issue(id: $id)"
answer = """{"data": {"issue": {"id": "1a2b3c4d-0000-4000-8000-000000000002", "identifier": "VED-2", "url": "http://linear.test/VED-2", "title": "The issue a commit names", "description": "as Linear would describe it", "dueDate": null, "priority": 0, "state": {"name": "Todo"}, "labels": {"nodes": []}, "assignee": null}}}"""

[[api]]
method = "POST"
path = "/graphql"
match = "attachmentCreate"
answer = """{"data": {"attachmentCreate": {"success": true}}}"""

# A state is named, not numbered, so writing one costs two lookups: the team the scope names,
# then that team's states. Both are answered here, because a reference that moves an issue is
# only proven end to end if the move's target resolves.

[[api]]
method = "POST"
path = "/graphql"
match = "query Teams"
answer = """{"data": {"teams": {"nodes": [{"id": "team-uuid", "key": "VED"}]}}}"""

[[api]]
method = "POST"
path = "/graphql"
match = "TeamStates"
answer = """{"data": {"team": {"states": {"nodes": [{"id": "state-todo", "name": "Todo"}, {"id": "state-progress", "name": "In Progress"}, {"id": "state-done", "name": "Done"}]}}}}"""

[[api]]
method = "POST"
path = "/graphql"
match = "issueUpdate"
answer = """{"data": {"issueUpdate": {"success": true, "issue": {"id": "1a2b3c4d-0000-4000-8000-000000000002", "url": "http://linear.test/VED-2"}}}}"""
