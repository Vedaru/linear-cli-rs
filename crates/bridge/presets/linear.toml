# Linear webhook preset.
#
# Linear is not a special case in code: it is this file. Linear signs the raw body
# with HMAC-SHA256 (hex) and, unlike the forges, puts the event type in the body
# instead of a header and sends a signed `webhookTimestamp` that bounds replay.

[signature]
headers = ["linear-signature"]
algorithm = "hmac-sha256"

[delivery]
headers = ["linear-delivery"]

[event]
# Linear names the event in the payload: Issue, Comment, Project, ...
body_field = "/type"

[freshness]
field = "/webhookTimestamp"
unit = "millis"
tolerance_secs = 60

[capabilities]
states = "named"
labels = true
due_dates = true
milestones = true
priorities = true
multiple_assignees = false
native_pull_requests = false
deletion = true

# An issue event: the subject is the issue itself.
[[event.rule]]
match = "Issue"
kind = "issue"
[event.rule.fields]
action = "/action"
id = "/data/id"
scope = "/data/team/key"
url = "/url"
actor = "/actor/id"
actor_name = "/actor/name"
[event.rule.actions]
create = "created"
update = "updated"
remove = "deleted"

# A comment event is *about* its issue. The issue is what a mapping pairs and what
# the link store knows, so the issue is the subject; the comment's own id travels
# in the detail and is what goes into the marker written on the copy - which is how
# that copy is recognised when the other platform announces it.
[[event.rule]]
match = "Comment"
kind = "comment"
[event.rule.fields]
action = "/action"
id = "/data/issue/id"
comment_id = "/data/id"
subject_kind = "issue"
body = "/data/body"
url = "/url"
actor = "/actor/id"
actor_name = "/actor/name"
[event.rule.actions]
create = "created"
update = "updated"
remove = "deleted"

# A project: the container an issue can live in. Mirrored as its own entity, but
# only when a mapping asks for it (`sync_projects`) - otherwise the event is still
# read, and the reconciler leaves it alone.
[[event.rule]]
match = "Project"
kind = "project"
[event.rule.fields]
action = "/action"
id = "/data/id"
url = "/url"
actor = "/actor/id"
actor_name = "/actor/name"
# Deliberately no `scope`: a Linear project is workspace-level and names its teams
# as a *list* (`/data/teams`), not as the single team a scope pointer resolves to.
# The mapping supplies the scope a pairing is looked up by.
[event.rule.actions]
create = "created"
update = "updated"
remove = "deleted"

# One catch-all still covers every Linear event: the event name selects the kind,
# and an event type this preset does not model still becomes an event of kind
# `event-name` rather than being dropped, so a new Linear feature is visible in
# the log instead of silently ignored.
[[event.rule]]
match = "*"
kind = "event-name"
[event.rule.kinds]
Issue = "issue"
Comment = "comment"
[event.rule.fields]
action = "/action"
id = "/data/id"
scope = "/data/team/key"
url = "/url"
actor = "/actor/id"
actor_name = "/actor/name"
body = "/data/body"
[event.rule.actions]
create = "created"
update = "updated"
remove = "deleted"

# ---------------------------------------------------------------------------
# The write half.
#
# The same engine as the forge sink - a GraphQL endpoint is not a special case:
# `variables` is a body template with the same directives, and the response is
# addressed by the same JSON pointers. What is specific to Linear is written
# here: ids instead of names (hence the lookups), a workspace that reports
# failure inside a `200 OK`, and a "delete" that is an archive.

[sink]
base_url = "https://api.linear.app/graphql"
# A rejected mutation arrives as `200 OK` with an `errors` array. Believing the
# status code here would mean reporting a sync that never happened.
error_pointer = "/errors"

[sink.auth]
header = "Authorization"
# Linear takes a personal API key raw - no `Bearer ` prefix.

[sink.issue.create]
method = "POST"
path = ""
id = "/data/issueCreate/issue/id"
url = "/data/issueCreate/issue/url"
[sink.issue.create.body]
query = "mutation IssueCreate($input: IssueCreateInput!) { issueCreate(input: $input) { success issue { id identifier url } } }"
variables = { input = { title = "$title", description = "$body", teamId = "$scope_id", stateId = "$state_id", projectMilestoneId = "$milestone_id", labelIds = "$label_ids", dueDate = "$due_date", priority = "$priority", assigneeId = "$assignee_id" } }

[sink.issue.update]
method = "POST"
path = ""
id = "/data/issueUpdate/issue/id"
[sink.issue.update.body]
query = "mutation IssueUpdate($id: String!, $input: IssueUpdateInput!) { issueUpdate(id: $id, input: $input) { success issue { id url } } }"
variables = { id = "$id", input = { title = "$title", description = "$body", stateId = "$state_id", projectMilestoneId = "$milestone_id", labelIds = "$label_ids", dueDate = "$due_date", priority = "$priority", assigneeId = "$assignee_id" } }

[sink.issue.fetch]
method = "POST"
path = ""
[sink.issue.fetch.body]
query = "query Issue($id: String!) { issue(id: $id) { id identifier url title description dueDate priority state { name } labels { nodes { name } } assignee { email } projectMilestone { name } project { id } } }"
variables = { id = "$id" }

# Every issue of the team, for a sweep. Linear pages by cursor, so the walk follows
# `pageInfo` rather than counting pages - and `hasNextPage` is what ends it.
#
# `$teamId` is declared `ID!`, not `String!`: the engine hands this variable the team
# UUID it resolved through the `team` lookup above (see `context`), but Linear validates
# the *document* before it looks at any value, and `filter: { team: { id: { eq: ... } } }`
# sits in an `ID` position - so `String!` is rejected for every value with
# "Variable \"$teamId\" of type \"String!\" used in position expecting type \"ID\"" and the
# sweep fails before it reads anything. The lookup is what makes a human key (`VED`)
# acceptable here at all: `issues(filter:)` compares ids and answers `eq must be a UUID`
# for a key, while `team(id:)` accepts either.
[sink.issue.list.request]
method = "POST"
path = ""
items = "/data/issues/nodes"
[sink.issue.list.request.body]
query = "query Issues($teamId: ID!, $after: String) { issues(first: 50, after: $after, filter: { team: { id: { eq: $teamId } } }) { nodes { id identifier url title description dueDate priority state { name } labels { nodes { name } } assignee { email } projectMilestone { name } project { id } } pageInfo { hasNextPage endCursor } } }"
variables = { teamId = "$scope_id", after = "$cursor" }
[sink.issue.list.paginate.cursor]
next = "/data/issues/pageInfo/endCursor"
more = "/data/issues/pageInfo/hasNextPage"
max_pages = 40
[sink.issue.list.read]
id = "/id"
url = "/url"
title = "/title"
body = "/description"
state = "/state/name"
due_date = "/dueDate"
milestone = "/projectMilestone/name"
priority = "/priority"
labels = { path = "/labels/nodes", pick = "/name" }
assignee = "/assignee/email"
project = "/project/id"
# The identifier a route may name an issue by (identity, not content).
identifier = "/identifier"

# Linear has no delete: `issueArchive` is how an issue is retired, and it keeps
# the issue recoverable, which is the safe direction for a mirror.
[sink.issue.delete]
method = "POST"
path = ""
[sink.issue.delete.body]
query = "mutation IssueArchive($id: String!) { issueArchive(id: $id) { success } }"
variables = { id = "$id" }

[sink.issue.comment.create]
method = "POST"
path = ""
id = "/data/commentCreate/comment/id"
url = "/data/commentCreate/comment/url"
[sink.issue.comment.create.body]
query = "mutation CommentCreate($input: CommentCreateInput!) { commentCreate(input: $input) { success comment { id url } } }"
variables = { input = { issueId = "$id", body = "$body" } }

[sink.issue.comment.update]
method = "POST"
path = ""
[sink.issue.comment.update.body]
query = "mutation CommentUpdate($id: String!, $input: CommentUpdateInput!) { commentUpdate(id: $id, input: $input) { success } }"
variables = { id = "$id", input = { body = "$body" } }

[sink.issue.comment.delete]
method = "POST"
path = ""
[sink.issue.comment.delete.body]
query = "mutation CommentDelete($id: String!) { commentDelete(id: $id) { success } }"
variables = { id = "$id" }

[sink.issue.transition]
method = "POST"
path = ""
[sink.issue.transition.body]
query = "mutation IssueState($id: String!, $input: IssueUpdateInput!) { issueUpdate(id: $id, input: $input) { success } }"
variables = { id = "$id", input = { stateId = "$state_id" } }

# The one operation a forge does not have: a pull request or commit becomes an
# attachment on the Linear issue.
[sink.issue.attach]
method = "POST"
path = ""
[sink.issue.attach.body]
query = "mutation AttachmentCreate($input: AttachmentCreateInput!) { attachmentCreate(input: $input) { success } }"
variables = { input = { issueId = "$id", url = "$url", title = "$title" } }

[sink.issue.read]
title = "/data/issue/title"
body = "/data/issue/description"
due_date = "/data/issue/dueDate"
milestone = "/data/issue/projectMilestone/name"
state = "/data/issue/state/name"
priority = "/data/issue/priority"
labels = { path = "/data/issue/labels/nodes", pick = "/name" }
assignee = "/data/issue/assignee/email"
project = "/data/issue/project/id"
id = "/data/issue/id"
url = "/data/issue/url"
# The identifier a person sees (`VED-119`), for a route that names an issue by it.
# Identity, not content: it is never written to the other side.
identifier = "/data/issue/identifier"

# Name -> UUID. A human writes `VED` and `Done`; every Linear mutation wants a
# UUID, so each name is resolved (and cached) through the same mechanism a forge
# uses for its label ids.

[sink.issue.lookup.team]
name = "/key"
id = "/id"
items = "/data/teams/nodes"
[sink.issue.lookup.team.list]
method = "POST"
path = ""
[sink.issue.lookup.team.list.body]
query = "query Teams { teams { nodes { id key } } }"

[sink.issue.lookup.state]
name = "/name"
id = "/id"
items = "/data/team/states/nodes"
[sink.issue.lookup.state.list]
method = "POST"
path = ""
[sink.issue.lookup.state.list.body]
query = "query TeamStates($teamId: String!) { team(id: $teamId) { states { nodes { id name } } } }"
variables = { teamId = "$scope_id" }

[sink.issue.lookup.label]
name = "/name"
id = "/id"
items = "/data/team/labels/nodes"
[sink.issue.lookup.label.list]
method = "POST"
path = ""
[sink.issue.lookup.label.list.body]
query = "query TeamLabels($teamId: String!) { team(id: $teamId) { labels { nodes { id name } } } }"
variables = { teamId = "$scope_id" }
[sink.issue.lookup.label.create]
method = "POST"
path = ""
id = "/data/issueLabelCreate/issueLabel/id"
[sink.issue.lookup.label.create.body]
query = "mutation IssueLabelCreate($input: IssueLabelCreateInput!) { issueLabelCreate(input: $input) { success issueLabel { id } } }"
variables = { input = { name = "$name", teamId = "$scope_id" } }

# The neutral assignee is an email, which is also how a Linear user is matched.
# Name -> id for a project milestone. Linear scopes these to a project, but the
# collection is queryable workspace-wide, which is what a lookup needs: the issue being
# written names its milestone, not its project. One name, one milestone - the ticket
# says what happens when two projects use the same name (nothing good, so: refuse).
[sink.issue.lookup.milestone]
name = "/name"
id = "/id"
items = "/data/projectMilestones/nodes"
[sink.issue.lookup.milestone.list]
method = "POST"
path = ""
[sink.issue.lookup.milestone.list.body]
query = "query ProjectMilestones { projectMilestones(first: 250) { nodes { id name } } }"

[sink.issue.lookup.assignee]
name = "/email"
id = "/id"
items = "/data/users/nodes"
[sink.issue.lookup.assignee.list]
method = "POST"
path = ""
[sink.issue.lookup.assignee.list.body]
query = "query Users { users { nodes { id email } } }"

# --- projects ---------------------------------------------------------------
#
# A project is mirrored as its own entity when a mapping sets `sync_projects`.
# It has a name and a description and nothing else the two platforms share, so the
# write half is the same engine with fewer fields: Linear spells them `name` /
# `description`, addresses a project by its id, and takes the team the project
# belongs to as a list of UUIDs - which is why `teamIds` carries the resolved
# `$scope_id` inside an array.

[sink.project.list.request]
method = "POST"
path = ""
items = "/data/projects/nodes"
[sink.project.list.request.body]
query = "query Projects($after: String) { projects(first: 50, after: $after) { nodes { id slugId name description state url externalLinks { nodes { url label } } } pageInfo { hasNextPage endCursor } } }"
variables = { after = "$cursor" }
[sink.project.list.paginate.cursor]
next = "/data/projects/pageInfo/endCursor"
more = "/data/projects/pageInfo/hasNextPage"
max_pages = 40
[sink.project.list.read]
id = "/id"
url = "/url"
title = "/name"
body = "/description"
# The alias a route may name this project by. Identity, not content: it is never
# written to the other side.
slug = "/slugId"
# External links, for resolving a repository this project names. Identity, not content.
links = { path = "/externalLinks/nodes", pick = "/url" }

[sink.project.fetch]
method = "POST"
path = ""
[sink.project.fetch.body]
query = "query Project($id: String!) { project(id: $id) { id slugId name description url externalLinks { nodes { url label } } } }"
variables = { id = "$id" }

[sink.project.create]
method = "POST"
path = ""
id = "/data/projectCreate/project/id"
url = "/data/projectCreate/project/url"
[sink.project.create.body]
query = "mutation ProjectCreate($input: ProjectCreateInput!) { projectCreate(input: $input) { success project { id url } } }"
variables = { input = { name = "$title", description = "$body", teamIds = ["$scope_id"] } }

[sink.project.update]
method = "POST"
path = ""
[sink.project.update.body]
query = "mutation ProjectUpdate($id: String!, $input: ProjectUpdateInput!) { projectUpdate(id: $id, input: $input) { success } }"
variables = { id = "$id", input = { name = "$title", description = "$body" } }

[sink.project.read]
title = "/data/project/name"
body = "/data/project/description"
id = "/data/project/id"
url = "/data/project/url"
slug = "/data/project/slugId"
links = { path = "/data/project/externalLinks/nodes", pick = "/url" }
