# GitHub webhook preset.
#
# GitHub signs the raw body with HMAC-SHA256 and sends `sha256=<hex>` in
# `X-Hub-Signature-256` - the one place a signature needs a prefix stripped before
# decoding. Its event names are plurals/underscores in a header, and the payload
# shape is the one Linear's own integration mirrors.

[signature]
headers = ["x-hub-signature-256"]
algorithm = "hmac-sha256"
prefix = "sha256="

[delivery]
headers = ["x-github-delivery"]

[event]
headers = ["x-github-event"]

[capabilities]
states = "open-closed"
labels = true
due_dates = false
priorities = false
multiple_assignees = true
native_pull_requests = true
deletion = false

[[event.rule]]
match = "issues"
kind = "issue"
[event.rule.fields]
action = "/action"
id = "/issue/number"
scope = "/repository/full_name"
url = "/issue/html_url"
actor = "/sender/login"
[event.rule.actions]
opened = "created"
edited = "updated"
closed = "closed"
reopened = "reopened"
deleted = "deleted"

[[event.rule]]
match = "issue_comment"
kind = "comment"
[event.rule.fields]
action = "/action"
id = "/comment/id"
scope = "/repository/full_name"
url = "/comment/html_url"
actor = "/sender/login"
body = "/comment/body"
[event.rule.actions]
created = "created"
edited = "updated"
deleted = "deleted"

[[event.rule]]
match = "pull_request"
kind = "reference"
[event.rule.fields]
action = "/action"
id = "/pull_request/number"
scope = "/repository/full_name"
url = "/pull_request/html_url"
actor = "/sender/login"
text = ["/pull_request/title", "/pull_request/body"]
[event.rule.actions]
opened = "created"
edited = "updated"
synchronized = "updated"
closed = "closed"
reopened = "reopened"

[[event.rule]]
match = "push"
kind = "reference"
action_default = "created"
[event.rule.fields]
fan_out = "/commits"
id = "/id"
text = ["/message"]
url = "/url"
scope = "/repository/full_name"
actor = "/commits/0/author/username"

# --- the API half -----------------------------------------------------------
#
# GitHub's REST v3. It differs from a forge in the places that matter here: labels are
# *names* GitHub manages itself (no lookup, no ids), closing and reopening an issue is a
# `state` on the issue, and there is no due-date field - which is why this preset's
# capabilities say so and the date travels as a `due:*` label instead.

[sink]
base_url = "https://api.github.com"

[sink.auth]
header = "Authorization"
# A fine-grained PAT and a GitHub App installation token both take `Bearer`.
prefix = "Bearer "

[sink.issue.create]
method = "POST"
path = "/repos/{scope}/issues"
id = "/number"
url = "/html_url"
[sink.issue.create.body]
title = "$title"
body = "$body"
labels = "$labels"
assignees = "$assignees"

[sink.issue.update]
method = "PATCH"
path = "/repos/{scope}/issues/{id}"
[sink.issue.update.body]
title = "$title"
body = "$body"
# Open or closed, carried on the issue itself.
state = "$state"
assignees = "$assignees"

[sink.issue.fetch]
method = "GET"
path = "/repos/{scope}/issues/{id}"

[sink.issue.transition]
method = "PATCH"
path = "/repos/{scope}/issues/{id}"
[sink.issue.transition.body]
state = "$state"

# GitHub takes label names on the issue and manages the repository's labels itself, so
# this replaces the set in one request and needs no name-to-id lookup.
[sink.issue.labels]
method = "PUT"
path = "/repos/{scope}/issues/{id}/labels"
[sink.issue.labels.body]
labels = "$labels"

[sink.issue.comment.create]
method = "POST"
path = "/repos/{scope}/issues/{id}/comments"
id = "/id"
url = "/html_url"
[sink.issue.comment.create.body]
body = "$body"

[sink.issue.comment.update]
method = "PATCH"
path = "/repos/{scope}/issues/comments/{id}"
[sink.issue.comment.update.body]
body = "$body"

[sink.issue.comment.delete]
method = "DELETE"
path = "/repos/{scope}/issues/comments/{id}"

[sink.issue.list.request]
method = "GET"
path = "/repos/{scope}/issues"
query = { state = "all", per_page = "50", page = "$page" }
# Numbered pages, and a page shorter than the limit is the last one.
[sink.issue.list.paginate.page]
param = "page"
size = 50
size_param = "per_page"
max_pages = 40

[sink.issue.list.read]
id = "/number"
url = "/html_url"
title = "/title"
body = "/body"
state = "/state"
labels = { path = "/labels", pick = "/name" }
assignee = "/assignees/0/login"
# No priority and no due-date field: both travel as labels, so both are read back
# from them - which is what keeps the two ends agreeing about a value this platform
# has nowhere else to put.
priority = { from_labels = true }
due_date = { from_labels = true }

[sink.issue.read]
title = "/title"
body = "/body"
state = "/state"
labels = { path = "/labels", pick = "/name" }
assignee = "/assignees/0/login"
priority = { from_labels = true }
due_date = { from_labels = true }
