# Forgejo / Gitea / Codeberg webhook preset.
#
# The forge signs the raw body with HMAC-SHA256 (hex) using the secret set on the
# repository's webhook and sends it in `X-Forgejo-Signature`; releases before the
# rename send `X-Gitea-Signature`, which is why both are listed and tried in
# order. There is no signed timestamp, so replay safety rests on the delivery id
# plus the link store.

[signature]
headers = ["x-forgejo-signature", "x-gitea-signature"]
algorithm = "hmac-sha256"

[delivery]
headers = ["x-forgejo-delivery", "x-gitea-delivery"]

[event]
headers = ["x-forgejo-event", "x-gitea-event"]

[capabilities]
states = "open-closed"
labels = true
due_dates = true
priorities = false
multiple_assignees = false
native_pull_requests = true
# The forge emits no webhook when an issue is deleted, so deletion can never be
# observed here - only pushed to it.
deletion = false

[[event.rule]]
match = "issues"
kind = "issue"
[event.rule.fields]
action = "/action"
id = "/issue/number"
scope = "/repository/full_name"
url = "/issue/html_url"
actor = "/sender/login"
[event.rule.actions]
opened = "created"
edited = "updated"
closed = "closed"
reopened = "reopened"
deleted = "deleted"

[[event.rule]]
match = "issue_comment"
kind = "comment"
[event.rule.fields]
action = "/action"
# The subject is the *issue* the comment is on: that is what a link pairs, and a
# comment event whose subject were the comment itself would have nothing to look up.
id = "/issue/number"
comment_id = "/comment/id"
# The event is a comment; the entity it points at is an issue.
subject_kind = "issue"
scope = "/repository/full_name"
url = "/comment/html_url"
actor = "/sender/login"
body = "/comment/body"
[event.rule.actions]
created = "created"
edited = "updated"
deleted = "deleted"

[[event.rule]]
match = "pull_request"
kind = "reference"
[event.rule.fields]
action = "/action"
id = "/pull_request/number"
scope = "/repository/full_name"
url = "/pull_request/html_url"
actor = "/sender/login"
text = ["/pull_request/title", "/pull_request/body"]
# Where the forge says whether the request was merged. A merge arrives as `action = closed`
# with this flag set, so the flag - not the action - is what says the work is finished. It is
# also what tells the engine this reference is a review request rather than a commit, which is
# why a push rule has no `merged`: a commit moves no issue through a workflow.
merged = "/pull_request/merged"
[event.rule.actions]
opened = "created"
edited = "updated"
synchronized = "updated"
closed = "closed"
reopened = "reopened"

# A push is the one delivery that fans out: every commit may reference an issue.
[[event.rule]]
match = "push"
kind = "reference"
action_default = "created"
[event.rule.fields]
fan_out = "/commits"
id = "/id"
text = ["/message"]
url = "/url"
scope = "/repository/full_name"
actor = "/author/email"
actor_name = "/author/name"

# ---------------------------------------------------------------------------
# The write half.
#
# Same platform, other direction, and still no forge-specific Rust: the sink
# engine executes these operations. The capabilities above are the shared
# contract - the write path is held to the same `[capabilities]` the read path
# declares, so a platform cannot claim in one direction what it denies in the
# other.

[sink]
base_url = "http://127.0.0.1:3000/api/v1"

# How a Forgejo web URL names a repository, so a project that declares a link to its
# repo can be resolved to the scope the mirror lives in. A link that does not match -
# a project also linking to a GitHub mirror, say - is simply not this platform's.
[sink.location]
# Where this platform's own URLs live, for reading a repository out of a link somebody
# put on a project. Relative to this connector's `api_url` (its origin, since the API
# prefix is not part of a repository URL), so a deployment only declares its address
# once. An absolute URL here would pin the pattern to one host.
url = "/{scope}"

[sink.auth]
header = "Authorization"
# Forgejo (like Gitea) wants the scheme in the value, not in the header name.
prefix = "token "

[sink.issue.create]
method = "POST"
path = "/repos/{scope}/issues"
id = "/number"
url = "/html_url"
[sink.issue.create.body]
title = "$title"
body = "$body"
labels = "$label_ids"
# `$field` disappears when the value is absent, which is what a create wants:
# nothing to say about a due date means the field is never mentioned.
due_date = "$due_date"
assignees = "$assignees"

[sink.issue.update]
method = "PATCH"
path = "/repos/{scope}/issues/{id}"
[sink.issue.update.body]
title = "$title"
body = "$body"
# A forge carries the state on the issue itself, so a transition is an update
# with a different `state`.
state = "$state"
# No `!` here: on an update, a field the patch does not mention must not appear in
# the request at all, and `!` would turn "not mentioned" into "set it to null" -
# silently clearing a due date nobody touched. A due date the other side really did
# clear arrives as an explicit null and is written.
due_date = "$due_date"
assignees = "$assignees"

[sink.issue.fetch]
method = "GET"
path = "/repos/{scope}/issues/{id}"

# Every issue in the repository, for a sweep. `state = "all"` because a mirror cares
# about closed issues too: an issue closed on the other side must be found, not
# re-created as a fresh open one.
[sink.issue.list.request]
method = "GET"
path = "/repos/{scope}/issues"
query = { state = "all", page = "$page", limit = "50" }
# A forge pages by number, and a page shorter than the limit is the last one - so
# the walk needs no extra request to find out where it ends.
[sink.issue.list.paginate.page]
param = "page"
size = 50
size_param = "limit"
max_pages = 40

# Pointers *inside each item*, unlike `[sink.issue.read]` above.
[sink.issue.list.read]
id = "/number"
url = "/html_url"
title = "/title"
body = "/body"
due_date = "/due_date"
state = "/state"
labels = { path = "/labels", pick = "/name" }
assignee = "/assignees/0/login"
priority = { from_labels = true }

[sink.issue.delete]
method = "DELETE"
path = "/repos/{scope}/issues/{id}"

# A forge replaces the whole label set in one call, and it addresses labels by
# id - which is why this operation and the `label` lookup below are a pair.
[sink.issue.labels]
method = "PUT"
path = "/repos/{scope}/issues/{id}/labels"
[sink.issue.labels.body]
labels = "$label_ids"

# A comment is created through its issue, then addressed by its own id: a mirrored
# edit must reach the copy rather than become a second comment.
[sink.issue.comment.create]
method = "POST"
path = "/repos/{scope}/issues/{id}/comments"
id = "/id"
url = "/html_url"
[sink.issue.comment.create.body]
body = "$body"

[sink.issue.comment.update]
method = "PATCH"
path = "/repos/{scope}/issues/comments/{id}"
[sink.issue.comment.update.body]
body = "$body"

[sink.issue.comment.delete]
method = "DELETE"
path = "/repos/{scope}/issues/comments/{id}"

[sink.issue.transition]
method = "PATCH"
path = "/repos/{scope}/issues/{id}"
[sink.issue.transition.body]
state = "$state"

# How a forge issue reads back into the neutral field set. The write path needs
# this as much as the reconciler does: a webhook payload is a snapshot, so the
# authoritative text of an issue is always fetched before it is mirrored.
[sink.issue.read]
title = "/title"
body = "/body"
due_date = "/due_date"
state = "/state"
labels = { path = "/labels", pick = "/name" }
assignee = "/assignees/0/login"
# A forge has no priority field. The priority travels as a `priority:*` label
# (and degrades to part of the body when the label cannot be written), so
# reading it back is reading the labels.
priority = { from_labels = true }

# Name -> id, for the label ids `$label_ids` needs. A label the bridge is told
# to apply but the repository does not have is created rather than dropped:
# silently losing a label is worse than an extra one.
[sink.issue.lookup.label]
name = "/name"
id = "/id"
[sink.issue.lookup.label.list]
method = "GET"
path = "/repos/{scope}/labels"
[sink.issue.lookup.label.create]
method = "POST"
path = "/repos/{scope}/labels"
id = "/id"
[sink.issue.lookup.label.create.body]
name = "$name"
color = "#ededed"

# --- projects ---------------------------------------------------------------
#
# A forge project has no description field of the kind an issue body is, so the
# pairing marker this bridge writes rides in the project's *description* and is
# read back into the neutral body - the same trick an issue body uses, and what
# lets a sweep adopt a project without the store.

[sink.project.list.request]
method = "GET"
path = "/repos/{scope}/projects"
query = { page = "$page", limit = "50" }
[sink.project.list.paginate.page]
param = "page"
size = 50
size_param = "limit"
max_pages = 40
[sink.project.list.read]
id = "/id"
url = "/html_url"
title = "/title"
body = "/description"

[sink.project.fetch]
method = "GET"
path = "/repos/{scope}/projects/{id}"

[sink.project.create]
method = "POST"
path = "/repos/{scope}/projects"
id = "/id"
url = "/html_url"
[sink.project.create.body]
title = "$title"
description = "$body"
# Forgejo builds a project's columns from a template. `none` is the empty one, but
# a project with no column cannot hold an issue, so a mirrored project asks for the
# kanban board: it is the only template that yields a default column for the issues
# a sweep assigns to it.
template_type = "basic_kanban"

[sink.project.update]
method = "PATCH"
path = "/repos/{scope}/projects/{id}"
[sink.project.update.body]
title = "$title"
description = "$body"

[sink.project.read]
title = "/title"
body = "/description"
id = "/id"
url = "/html_url"

# A mirrored issue landing on its mirrored project's board. `{id}` is the project
# and `{index}` the issue; an issue belongs to at most one project, so assigning it
# to a different one *moves* it, and an explicit removal is only needed when the
# project is cleared.
#
# The body names the card's *column* when the mapping said which states belong in
# which one. Absent, the key is omitted rather than sent as null - the difference
# between leaving the column alone and clearing it - and Forgejo puts the card in the
# project's default column, which is what a mapping with no columns table still gets.
[sink.project.assign]
method = "POST"
path = "/repos/{scope}/projects/{id}/issues/{index}"
[sink.project.assign.body]
column_id = "$column_id"

# What a board calls its columns, for the id `$column_id` needs. Listed per *project*,
# which is why this lookup - alone among them - names a container as well as a scope:
# two boards in one repository may both have an "In Progress".
[sink.project.lookup.column]
name = "/title"
id = "/id"
[sink.project.lookup.column.list]
method = "GET"
path = "/repos/{scope}/projects/{id}/columns"

[sink.project.unassign]
method = "DELETE"
path = "/repos/{scope}/projects/{id}/issues/{index}"
