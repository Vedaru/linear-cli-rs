[package]
name = "linear"
version = "2.6.0"
edition = "2021"
description = "Unofficial Linear CLI (Rust port) built for headless agent use"
license = "MIT"
repository = "https://github.com/schpet/linear-cli"
rust-version = "1.80"

[[bin]]
name = "linear"
path = "src/main.rs"

[workspace]
# The CLI is the only binary in the workspace; everything it needs beyond
# argument parsing and Linear itself lives in a library, so the same code can be
# driven from a test, from an agent, or from the service loop rather than only
# from argv. See crates/bridge/README.md for the layering rules.
members = ["crates/bridge"]
# A bare `cargo test` in the repository root must mean "the whole product", not
# "the binary's crate". Without this, `cargo test` silently skipped every test in
# crates/bridge - including the CI gate's, which is how a whole crate's suite can
# be green-by-absence. The workflows pass `--workspace` explicitly as well.
default-members = [".", "crates/bridge"]

[features]
# The CLI is the product; the bridge half is opt-in. A bare `cargo build` therefore produces the
# same surface as upstream - no store, no intake server, nothing to configure - which is what a
# machine that only talks to Linear wants, and what keeps SQLite out of that binary.
#
# `service` adds the `linear-bridge` half: `linear sync` (the mirroring engine, one-shot) and
# `linear webhook serve|replay` (the intake server). The published release asset is built with it
# on, because the deployment that consumes that asset *is* the service; a build from source that
# is meant to run the service has to ask for it explicitly.
default = []
service = ["dep:linear-bridge"]

[dependencies]
# The webhook/bridge framework: domain model, connector traits, webhook intake,
# durable queue and link store. Platform-agnostic by construction.
linear-bridge = { path = "crates/bridge", optional = true }
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.5.67"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.9", features = ["preserve_order"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }
anyhow = "1"
thiserror = "2"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
unicode-width = "0.2"
rpassword = "7"
url = "2"
sha2 = "0.10"
terminal_size = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile = "3"
# The integration suites state the same bound both ways (`--since 7d` and the date it means),
# which needs a clock on the test's side of the process boundary.
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
# Size over throughput: every command is network-bound, so the slower code this
# generates is invisible next to an API round trip, while the binary itself ships
# to servers and agents. Measured on the same source and toolchain against cargo's
# default release profile (opt-level 3, no LTO, 16 codegen units, unstripped,
# unwinding), rustc 1.93.1:
# 16.25 MiB -> 4.94 MiB (-70%).
#
# panic = "abort" additionally drops the unwinding tables (.eh_frame,
# .gcc_except_table) that stripping cannot remove. Nothing in this crate catches
# panics and tests run on the dev profile, so abort is safe here - but a
# release-mode test run would need -Z panic-abort-tests.
opt-level = "z"
panic = "abort"
